project:
  title: "Experimentation at Scale: Challenges and Opportunities in A/B Testing, from Industry"
  output-dir: _output

format:
  revealjs:
    theme: [default, theme.scss, sections/_intro.scss, sections/_p1.scss, sections/_p2.scss, sections/_p3.scss]
    width: 1280
    height: 720
    slide-number: c/t
    show-slide-number: all
    progress: true
    history: true
    menu: true
    overview: true
    embed-resources: true
    html-math-method: katex
    auto-stretch: false
    highlight-style: github
    fig-align: center
    link-external-newwindow: true
